<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AdI Bot</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="sidebar">
        <div class="sidebar-header">
            <span class="logo">🧠 AdI Bot</span>
            <button id="newChatBtn" title="New Chat">&#43;</button>
        </div>
        
        <div class="chat-history">
            <div class="chat-history-title">Chat History</div>
            <div class="chat-list" id="chatList">
                <!-- Chats will be loaded here -->
            </div>
        </div>

        <div class="sidebar-footer">
            <p>Your AI Psychotherapist</p>
        </div>
    </div>

    <div class="main">
        <div class="chat-area" id="chatArea">
            <div class="welcome" id="welcomeMsg">
                <h1>How are you feeling today?</h1>
                <p>I'm here to listen and support you.</p>
            </div>
        </div>

        <div class="input-area">
            <form id="messageForm">
                <div class="input-box">
                    <textarea id="userInput" name="msg" placeholder="Message AdI Bot..." rows="1" required></textarea>
                    <button type="submit" id="sendBtn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" width="20" height="20">
                            <path d="M2 21l21-9L2 3v7l15 2-15 2v7z"/>
                        </svg>
                    </button>
                </div>
            </form>
            <p class="disclaimer">AdI Bot can make mistakes. For emergencies call <strong>9152987821</strong>.</p>
        </div>
    </div>

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
    <script>
        const chatArea = document.getElementById('chatArea');
        const welcomeMsg = document.getElementById('welcomeMsg');
        const userInput = document.getElementById('userInput');
        const chatList = document.getElementById('chatList');
        
        let currentChatId = null;

        // Load all chats on startup
        function loadChatsList() {
            $.ajax({
                url: '/api/chats',
                type: 'GET',
                success: function(chats) {
                    chatList.innerHTML = '';
                    if (chats.length === 0) {
                        chatList.innerHTML = '<div class="no-chats">No chats yet</div>';
                        return;
                    }
                    
                    chats.forEach(chat => {
                        const chatItem = document.createElement('div');
                        chatItem.classList.add('chat-item');
                        if (chat.id === currentChatId) {
                            chatItem.classList.add('active');
                        }
                        
                        chatItem.innerHTML = `
                            <div class="chat-item-content" onclick="switchChat('${chat.id}')">
                                <div class="chat-item-name">${chat.name}</div>
                                <div class="chat-item-preview">${chat.preview || 'No messages'}</div>
                            </div>
                            <button class="chat-delete-btn" onclick="deleteChat(event, '${chat.id}')">🗑️</button>
                        `;
                        chatList.appendChild(chatItem);
                    });
                }
            });
        }

        function switchChat(chatId) {
            currentChatId = chatId;
            chatArea.innerHTML = '';
            welcomeMsg.style.display = 'flex';
            chatArea.appendChild(welcomeMsg);
            
            $.ajax({
                url: `/api/chat/${chatId}`,
                type: 'GET',
                success: function(data) {
                    const messages = data.messages;
                    if (messages.length > 0) {
                        welcomeMsg.style.display = 'none';
                        messages.forEach(msg => {
                            appendMessage(msg.role, msg.text);
                        });
                    }
                    loadChatsList();
                }
            });
        }

        function deleteChat(event, chatId) {
            event.stopPropagation();
            if (confirm('Delete this chat?')) {
                $.ajax({
                    url: `/api/chat/${chatId}/delete`,
                    type: 'DELETE',
                    success: function() {
                        if (currentChatId === chatId) {
                            createNewChat();
                        } else {
                            loadChatsList();
                        }
                    }
                });
            }
        }

        function createNewChat() {
            $.ajax({
                url: '/api/chat/new',
                type: 'POST',
                success: function(data) {
                    currentChatId = data.chat_id;
                    chatArea.innerHTML = '';
                    welcomeMsg.style.display = 'flex';
                    chatArea.appendChild(welcomeMsg);
                    userInput.value = '';
                    loadChatsList();
                }
            });
        }

        function appendMessage(role, text) {
            welcomeMsg.style.display = 'none';
            const wrapper = document.createElement('div');
            wrapper.classList.add('message', role);
            const bubble = document.createElement('div');
            bubble.classList.add('bubble');
            bubble.innerText = text;
            wrapper.appendChild(bubble);
            chatArea.appendChild(wrapper);
            chatArea.scrollTop = chatArea.scrollHeight;
        }

        // Initialize on page load
        loadChatsList();
        if (currentChatId === null) {
            createNewChat();
        }

        document.getElementById('messageForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const text = userInput.value.trim();
            if (!text || !currentChatId) return;

            appendMessage('user', text);
            userInput.value = '';
            userInput.style.height = 'auto';

            const typing = document.createElement('div');
            typing.classList.add('message', 'bot');
            typing.id = 'typing';
            typing.innerHTML = '<div class="bubble typing"><span></span><span></span><span></span></div>';
            chatArea.appendChild(typing);
            chatArea.scrollTop = chatArea.scrollHeight;

            $.ajax({
                data: { 
                    msg: text,
                    chat_id: currentChatId
                },
                type: 'POST',
                url: '/get',
                success: function(response) {
                    document.getElementById('typing').remove();
                    appendMessage('bot', response.answer);
                    loadChatsList();
                }
            });
        });

        document.getElementById('newChatBtn').addEventListener('click', function() {
            createNewChat();
        });

        userInput.addEventListener('input', function() {
            this.style.height = 'auto';
            this.style.height = Math.min(this.scrollHeight, 200) + 'px';
        });

        userInput.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                document.getElementById('messageForm').dispatchEvent(new Event('submit'));
            }
        });
    </script>
</body>
</html>
